<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário Squad 4</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface2: #F0EEE8;
  --border: #E2DED4;
  --border2: #CBC7BC;
  --text: #1A1917;
  --text2: #6B6760;
  --text3: #9E9B94;
  --accent: #1D9E75;
  --accent-hover: #0F6E56;
  --danger: #E24B4A;
  --radius: 8px;
  --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── Header ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
  flex: 1;
  min-width: 160px;
}
.header-title span { color: var(--text2); font-weight: 400; }
.nav-year { display: flex; align-items: center; gap: 6px; }
.nav-year button {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 30px; height: 30px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.nav-year button:hover { background: var(--border); }
.nav-year .yr { font-size: 15px; font-weight: 600; min-width: 44px; text-align: center; font-family: 'DM Mono', monospace; }
.btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background .15s, transform .1s;
  font-family: 'DM Sans', sans-serif;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c03838; }

/* ── Legend ── */
.legend-bar {
  padding: 10px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.leg-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 6px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: opacity .15s, border-color .15s;
}
.leg-chip:hover { opacity: .8; }
.leg-chip.active { border-color: var(--text2); }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── Calendar ── */
.cal-wrap { overflow-x: auto; padding: 20px 24px; }
.cal-table { width: 100%; border-collapse: collapse; min-width: 960px; }
.cal-table th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--text2);
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--border);
  background: var(--surface);
}
.cal-table th:first-child { background: var(--bg); border-color: transparent; }
.week-th {
  font-size: 9px !important;
  color: var(--text3) !important;
  letter-spacing: .3px !important;
  text-transform: none !important;
  background: var(--bg) !important;
  border-color: var(--border) !important;
  width: 44px;
  font-family: 'DM Mono', monospace;
  line-height: 1.4;
}
.cal-cell {
  border: 1px solid var(--border);
  vertical-align: top;
  padding: 4px;
  height: 72px;
  background: var(--surface);
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.cal-cell:hover { background: #FAFAF7; }

/* ── Event chip ── */
.ev-chip {
  border-radius: 5px;
  padding: 3px 6px;
  margin-bottom: 2px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 4px;
  transition: opacity .12s, transform .1s;
  position: relative;
}
.ev-chip:hover { opacity: .85; transform: translateY(-1px); }
.ev-info { flex: 1; min-width: 0; }
.ev-name {
  font-size: 10px;
  font-weight: 600;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.ev-date { font-size: 9px; opacity: .75; font-family: 'DM Mono', monospace; }
.ev-status { font-size: 12px; flex-shrink: 0; margin-top: 1px; }

/* ── Modal ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; animation: fadeIn .15s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 24px;
  width: 380px;
  max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,.12);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from{transform:translateY(8px);opacity:0} to{transform:none;opacity:1} }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: var(--text2); padding: 2px 6px;
  border-radius: 4px;
}
.modal-close:hover { background: var(--surface2); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; letter-spacing: .4px; text-transform: uppercase; }
.field input[type=text],
.field input[type=date],
.field select {
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--surface);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  transition: border-color .15s;
  outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }

/* Color picker row */
.color-row { display: flex; align-items: center; gap: 10px; }
.color-presets { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.color-swatch {
  width: 22px; height: 22px;
  border-radius: 5px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .12s, border-color .12s;
}
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.selected { border-color: var(--text); transform: scale(1.1); }
.color-custom { width: 28px; height: 28px; border-radius: 5px; cursor: pointer; border: 1.5px solid var(--border2); overflow: hidden; padding: 0; }
.color-custom input[type=color] { width: 130%; height: 130%; margin: -15%; cursor: pointer; border: none; background: none; }

.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── Status bar ── */
.status-bar {
  padding: 6px 24px;
  font-size: 11px;
  color: var(--text3);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
}

/* ── Empty state ── */
.empty-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  opacity: .12;
  pointer-events: none;
}

/* ── Export btn ── */
.export-hint { font-size: 11px; color: var(--text3); padding: 8px 24px 4px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">Calendário Squad 4 <span>2026</span></div>
  <div class="nav-year">
    <button onclick="changeYear(-1)">&#8249;</button>
    <span class="yr" id="yr-label">2026</span>
    <button onclick="changeYear(1)">&#8250;</button>
  </div>
  <button class="btn btn-secondary" onclick="exportJSON()" title="Exportar eventos">&#8595; Exportar</button>
  <label class="btn btn-secondary" title="Importar eventos">&#8593; Importar<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label>
  <button class="btn btn-primary" onclick="openNew()">+ Nova ação</button>
</div>

<!-- LEGEND -->
<div class="legend-bar" id="legend-bar"></div>

<!-- STATUS -->
<div class="status-bar" id="status-bar">&nbsp;</div>

<!-- CALENDAR -->
<div class="cal-wrap">
  <table class="cal-table" id="cal-table"></table>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Nova ação</h3>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="field">
      <label>Nome da ação</label>
      <input type="text" id="f-name" placeholder="Ex: Renovação EE14 2º Lote">
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>Cor</label>
      <div class="color-row">
        <div class="color-presets" id="color-presets"></div>
        <div class="color-custom" title="Cor personalizada">
          <input type="color" id="f-color-custom" value="#5DCAA5" onchange="selectCustomColor(this.value)">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="auto">Automático (pela data)</option>
        <option value="ok">✅ Concluído</option>
        <option value="cancelled">❌ Cancelado</option>
        <option value="pending">⏳ Pendente</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-del" onclick="deleteEvent()" style="display:none;margin-right:auto">Excluir</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEvent()">Salvar</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WEEKS = [
  {label:'01–06', start:1, end:6},
  {label:'07–14', start:7, end:14},
  {label:'15–22', start:15, end:22},
  {label:'23–31', start:23, end:31},
];

const PRESETS = [
  '#9FE1CB','#5DCAA5','#AFA9EC','#7F77DD',
  '#85B7EB','#378ADD','#F09595','#E24B4A',
  '#FAC775','#EF9F27','#F4C0D1','#D4537E',
  '#C0DD97','#639922','#D3D1C7','#888780',
  '#FAEEDA','#F5C4B3','#B5D4F4','#EEEDFE',
];

let currentYear = new Date().getFullYear();
let events = [];
let editingId = null;
let filterColor = null;
let selectedColor = PRESETS[0];

// ── Utility ──────────────────────────────────────────────
function uid() { return 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function parseDate(str) { return new Date(str + 'T12:00:00'); }

function getStatus(ev) {
  if (ev.status !== 'auto') return ev.status;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = parseDate(ev.date); d.setHours(0,0,0,0);
  return d < today ? 'ok' : 'pending';
}

function statusIcon(s) {
  if (s === 'ok') return '✅';
  if (s === 'cancelled') return '❌';
  return '⏳';
}

function textColor(hex) {
  // luminance check → return dark or light text
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.55 ? darken(hex, 60) : '#FFFFFF';
}

function darken(hex, pct) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - pct); g = Math.max(0, g - pct); b = Math.max(0, b - pct);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function getEventMonth(ev) { return parseDate(ev.date).getMonth(); }
function getEventYear(ev) { return parseDate(ev.date).getFullYear(); }
function getEventDay(ev) { return parseDate(ev.date).getDate(); }
function getEventWeek(ev) {
  const d = getEventDay(ev);
  if (d <= 6) return 0;
  if (d <= 14) return 1;
  if (d <= 22) return 2;
  return 3;
}

// ── Render ────────────────────────────────────────────────
function render() {
  document.getElementById('yr-label').textContent = currentYear;
  document.querySelector('.header-title').innerHTML = `Calendário Squad 4 <span>${currentYear}</span>`;
  renderLegend();
  renderTable();
  renderStatus();
}

function renderLegend() {
  const bar = document.getElementById('legend-bar');
  const yearEvs = events.filter(e => getEventYear(e) === currentYear);
  const colors = [...new Set(yearEvs.map(e => e.color))];
  if (colors.length === 0) { bar.innerHTML = '<span style="font-size:11px;color:var(--text3)">Nenhum evento ainda — clique em "+ Nova ação" para começar</span>'; return; }
  bar.innerHTML = colors.map(c => {
    const evs = yearEvs.filter(e => e.color === c);
    const active = filterColor === c;
    const tc = textColor(c);
    return `<div class="leg-chip ${active?'active':''}" style="background:${c};color:${tc}" onclick="toggleFilter('${c}')">
      <div class="leg-dot" style="background:${tc};opacity:.4"></div>
      ${evs[0].name.split(' ').slice(0,3).join(' ')} (${evs.length})
    </div>`;
  }).join('');
}

function renderTable() {
  const tbl = document.getElementById('cal-table');
  const yearEvs = events.filter(e => getEventYear(e) === currentYear && (!filterColor || e.color === filterColor));

  let html = '<thead><tr><th class="week-th">Semana</th>';
  MONTHS.forEach(m => html += `<th>${m.toUpperCase()}</th>`);
  html += '</tr></thead><tbody>';

  WEEKS.forEach((wk, wi) => {
    html += `<tr><th class="week-th">${wk.label}</th>`;
    MONTHS.forEach((m, mi) => {
      const evs = yearEvs.filter(e => getEventMonth(e) === mi && getEventWeek(e) === wi);
      html += `<td class="cal-cell" onclick="openNewForCell(${mi},${wi})">`;
      if (evs.length === 0) {
        html += `<div class="empty-hint">+</div>`;
      } else {
        evs.forEach(ev => {
          const st = getStatus(ev);
          const d = parseDate(ev.date);
          const dayStr = d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0');
          const tc = textColor(ev.color);
          html += `<div class="ev-chip" style="background:${ev.color}" onclick="event.stopPropagation();editEvent('${ev.id}')" title="${ev.name} — ${dayStr}">
            <div class="ev-info">
              <span class="ev-name" style="color:${tc}">${ev.name}</span>
              <span class="ev-date" style="color:${tc}">${dayStr}</span>
            </div>
            <span class="ev-status">${statusIcon(st)}</span>
          </div>`;
        });
      }
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}

function renderStatus() {
  const bar = document.getElementById('status-bar');
  const yearEvs = events.filter(e => getEventYear(e) === currentYear);
  if (yearEvs.length === 0) { bar.innerHTML = '&nbsp;'; return; }
  const ok = yearEvs.filter(e => getStatus(e) === 'ok').length;
  const pend = yearEvs.filter(e => getStatus(e) === 'pending').length;
  const canc = yearEvs.filter(e => getStatus(e) === 'cancelled').length;
  bar.textContent = `${yearEvs.length} ações em ${currentYear}  ·  ✅ ${ok} concluídas  ·  ⏳ ${pend} pendentes  ·  ❌ ${canc} canceladas${filterColor ? '  ·  [filtro ativo]' : ''}`;
}

// ── Color selector ────────────────────────────────────────
function renderColorPresets(current) {
  const wrap = document.getElementById('color-presets');
  wrap.innerHTML = PRESETS.map(c =>
    `<div class="color-swatch ${c===current?'selected':''}" style="background:${c}" onclick="selectColor('${c}')" title="${c}"></div>`
  ).join('');
}

function selectColor(c) {
  selectedColor = c;
  document.getElementById('f-color-custom').value = c;
  renderColorPresets(c);
}

function selectCustomColor(c) {
  selectedColor = c;
  renderColorPresets(c); // none will match preset, all unselected
  // highlight custom input border
}

// ── Filter ───────────────────────────────────────────────
function toggleFilter(c) {
  filterColor = filterColor === c ? null : c;
  render();
}

function changeYear(d) { currentYear += d; render(); }

// ── Modal ─────────────────────────────────────────────────
function openNew() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nova ação';
  document.getElementById('f-name').value = '';
  const today = new Date();
  document.getElementById('f-date').value = `${currentYear}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
  document.getElementById('f-status').value = 'auto';
  document.getElementById('btn-del').style.display = 'none';
  selectedColor = PRESETS[Math.floor(Math.random() * 8)];
  renderColorPresets(selectedColor);
  document.getElementById('f-color-custom').value = selectedColor;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 60);
}

function openNewForCell(mi, wi) {
  openNew();
  const day = wi === 0 ? 3 : wi === 1 ? 10 : wi === 2 ? 17 : 25;
  const mm = String(mi+1).padStart(2,'0');
  const dd = String(day).padStart(2,'0');
  document.getElementById('f-date').value = `${currentYear}-${mm}-${dd}`;
}

function editEvent(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar ação';
  document.getElementById('f-name').value = ev.name;
  document.getElementById('f-date').value = ev.date;
  document.getElementById('f-status').value = ev.status;
  selectedColor = ev.color;
  renderColorPresets(ev.color);
  document.getElementById('f-color-custom').value = ev.color;
  document.getElementById('btn-del').style.display = '';
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function saveEvent() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const status = document.getElementById('f-status').value;
  const color = selectedColor;
  if (!name) { alert('Informe o nome da ação.'); document.getElementById('f-name').focus(); return; }
  if (!date) { alert('Informe a data.'); document.getElementById('f-date').focus(); return; }

  if (editingId) {
    const ev = events.find(e => e.id === editingId);
    Object.assign(ev, { name, date, status, color });
  } else {
    events.push({ id: uid(), name, date, status, color });
  }
  saveLocal();
  closeModal();
  render();
}

function deleteEvent() {
  if (!editingId) return;
  if (!confirm('Excluir esta ação?')) return;
  events = events.filter(e => e.id !== editingId);
  saveLocal();
  closeModal();
  render();
}

// ── Persist ───────────────────────────────────────────────
function saveLocal() {
  try { localStorage.setItem('sq4_events', JSON.stringify(events)); } catch(e) {}
}
function loadLocal() {
  try {
    const d = localStorage.getItem('sq4_events');
    if (d) events = JSON.parse(d);
  } catch(e) {}
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `calendario_squad4_${currentYear}.json`;
  a.click();
}

function importJSON(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      events = data;
      saveLocal();
      render();
      alert(`${data.length} eventos importados com sucesso!`);
    } catch { alert('Arquivo inválido. Use um JSON exportado deste calendário.'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

// ── Demo data ─────────────────────────────────────────────
const DEMO_EVENTS = [
  {id:'d1',name:'Renovação EE14 2º Lote',date:'2026-02-03',status:'auto',color:'#85B7EB'},
  {id:'d2',name:'Renovação DE9 1º Lote',date:'2026-03-02',status:'auto',color:'#85B7EB'},
  {id:'d3',name:'Férias Andreza',date:'2026-05-04',status:'auto',color:'#FAC775'},
  {id:'d4',name:'Ascensão Gladius',date:'2026-03-02',status:'auto',color:'#AFA9EC'},
  {id:'d5',name:'Formatura TV5',date:'2026-03-12',status:'auto',color:'#C0DD97'},
  {id:'d6',name:'Shark Day',date:'2026-07-04',status:'auto',color:'#9FE1CB'},
  {id:'d7',name:'Hackers Day',date:'2026-08-01',status:'auto',color:'#D3D1C7'},
